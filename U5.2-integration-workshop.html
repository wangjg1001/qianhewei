<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>积分工坊 · Integration of x^n</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --plum:#86198F;--plum-mid:#A21CAF;--plum-lt:#FAE8FF;
  --teal:#0F766E;--teal-lt:#CCFBF1;
  --orange:#C2410C;--orange-lt:#FFF7ED;
  --blue:#1D4ED8;--blue-lt:#EFF6FF;
  --rose:#BE123C;--rose-lt:#FFF1F3;
  --amber:#B45309;--amber-lt:#FEF3C7;
  --slate:#1E293B;--slate-m:#64748B;
  --bg:#FDF4FF;--white:#FFF;
  --gold:#FBBF24;--green:#16A34A;--green-lt:#DCFCE7;
  --shadow-s:0 2px 12px rgba(134,25,143,.07);
  --shadow-m:0 6px 24px rgba(134,25,143,.11);
  --r:14px;--r-lg:20px;
}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--slate);overflow-x:hidden;min-height:100vh;-webkit-tap-highlight-color:transparent}
.screen{display:none;min-height:100vh;flex-direction:column}.screen.active{display:flex}
.welcome{align-items:center;justify-content:center;background:linear-gradient(155deg,#FAE8FF 0%,#F5D0FE 30%,#E879F9 60%,#D946EF 100%);padding:40px 24px}
.w-box{position:relative;z-index:2;text-align:center;max-width:520px}
.w-badge{display:inline-block;padding:6px 16px;border-radius:100px;background:rgba(134,25,143,.1);border:1px solid rgba(134,25,143,.2);font-size:11px;font-weight:700;color:var(--plum);letter-spacing:1.5px;margin-bottom:20px}
.w-title{font-size:clamp(30px,7.5vw,50px);font-weight:700;line-height:1.08;color:var(--slate);margin-bottom:10px}
.w-title em{font-style:normal;color:var(--plum)}
.w-skills{display:flex;flex-direction:column;gap:8px;margin:14px auto 20px;max-width:390px}
.w-sk{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:10px;background:var(--white);box-shadow:var(--shadow-s);font-size:12px;font-weight:600}
.w-sk-num{min-width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.w-sk-expr{font-family:'JetBrains Mono',monospace;flex:1;color:var(--slate);text-align:left}
.w-sub{font-size:15px;color:var(--slate-m);font-weight:500;line-height:1.7;margin-bottom:36px}
.w-sub small{display:block;font-size:13px;margin-top:6px;opacity:.6}
.btn-go{display:inline-flex;align-items:center;gap:10px;background:var(--plum-mid);color:#fff;border:none;padding:16px 42px;border-radius:100px;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 8px 28px rgba(162,28,175,.3);transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.btn-go:hover{transform:translateY(-3px)}.btn-go:active{transform:scale(.97)}
.map-s{background:linear-gradient(180deg,var(--plum-lt) 0%,var(--bg) 100%);padding:0}
.m-top{padding:18px 22px;display:flex;align-items:center;justify-content:space-between}
.m-h{font-size:20px;font-weight:700}.m-st{display:flex;align-items:center;gap:5px;background:var(--amber-lt);padding:7px 14px;border-radius:100px;font-weight:700;color:var(--amber);font-size:14px}
.m-list{flex:1;padding:6px 18px 36px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.zc{background:var(--white);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-s);cursor:pointer;display:flex;align-items:center;gap:14px;border:2px solid transparent;transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.zc:hover{transform:translateY(-2px);box-shadow:var(--shadow-m)}.zc:active{transform:scale(.98)}
.zc.lk{opacity:.4;pointer-events:none;filter:grayscale(.3)}.zc.dn{border-color:var(--green)}.zc.nw{border-color:var(--plum-mid);animation:zcP 2s ease-in-out infinite}
@keyframes zcP{0%,100%{box-shadow:var(--shadow-s),0 0 0 0 rgba(162,28,175,.1)}50%{box-shadow:var(--shadow-s),0 0 0 8px rgba(162,28,175,.04)}}
.zi{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-weight:700;font-family:'JetBrains Mono',monospace;text-align:center;line-height:1.1}
.zb{flex:1}.zn{font-size:15px;font-weight:700;margin-bottom:2px}.zd{font-size:11px;color:var(--slate-m);font-weight:500}
.zdots{display:flex;gap:4px;margin-top:6px}.zdt{width:8px;height:8px;border-radius:50%;background:#E2E8F0;transition:.3s}.zdt.on{background:var(--gold)}.zdt.cu{background:var(--plum-mid);animation:dp 1.4s ease-in-out infinite}
@keyframes dp{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
.zr{flex-shrink:0}.zsv{font-size:12px;font-weight:700;color:var(--amber)}
.game-s{background:var(--bg);padding:0}
.gh{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--white);box-shadow:0 1px 8px rgba(0,0,0,.03)}
.gh-b{background:none;border:none;font-size:14px;font-weight:600;color:var(--slate-m);cursor:pointer;font-family:inherit;padding:8px}
.gh-z{font-size:12px;font-weight:700;color:var(--plum-mid)}
.gh-l{font-size:12px;font-weight:600;color:var(--slate-m)}
.gbd{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 12px 20px;overflow-y:auto}
.gds{display:flex;gap:8px;margin-bottom:10px}
.gd{width:10px;height:10px;border-radius:50%;background:#E2E8F0;transition:.4s cubic-bezier(.34,1.56,.64,1)}.gd.done{background:var(--green);transform:scale(1.1)}.gd.act{background:var(--plum-mid);transform:scale(1.3);box-shadow:0 0 0 4px rgba(162,28,175,.18)}
.q-card{background:var(--white);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow-s);text-align:center;max-width:460px;width:100%;margin-bottom:8px;position:relative;overflow:hidden}
.q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--plum-mid),var(--teal),var(--orange))}
.q-lbl{font-size:10px;font-weight:700;color:var(--plum-mid);letter-spacing:1px;margin-bottom:5px}
.q-expr{font-family:'JetBrains Mono',monospace;font-size:clamp(16px,4.2vw,22px);font-weight:700;color:var(--slate);line-height:1.5;word-break:break-word}
.q-cond{font-size:12px;font-weight:700;color:var(--blue);margin-top:5px}
.q-task{font-size:12px;font-weight:600;color:var(--teal);margin-top:3px}
.rw-card{background:var(--white);border-radius:var(--r);padding:11px 16px;box-shadow:var(--shadow-s);max-width:460px;width:100%;margin-bottom:8px;display:none}
.rw-lbl{font-size:10px;font-weight:700;color:var(--orange);letter-spacing:1px;margin-bottom:5px}
.rw-row{font-family:'JetBrains Mono',monospace;font-size:clamp(12px,3.2vw,15px);font-weight:600;color:var(--slate);line-height:1.8}
.rw-step{opacity:0;transform:translateY(6px);transition:all .35s ease}.rw-step.show{opacity:1;transform:translateY(0)}
.step-panel{width:100%;max-width:460px;background:var(--white);border-radius:var(--r);box-shadow:var(--shadow-s);margin-bottom:10px;overflow:hidden;display:none}
.step-title{padding:8px 14px;font-size:11px;font-weight:700;color:var(--plum-mid);letter-spacing:.5px;border-bottom:1px solid var(--plum-lt)}
.step-body{padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.9;color:var(--slate)}
.step-ln{opacity:0;transform:translateY(8px);transition:all .4s ease}.step-ln.show{opacity:1;transform:translateY(0)}
.step-num{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--plum-lt);color:var(--plum);font-size:9px;font-weight:700;text-align:center;line-height:18px;margin-right:6px;font-family:'Space Grotesk',sans-serif}
.step-ok{color:var(--green);font-weight:700}.step-c{color:var(--rose);font-weight:700}.step-hl{color:var(--orange);font-weight:700}
.info-box{width:100%;max-width:460px;background:var(--white);border-radius:var(--r);padding:10px 14px;box-shadow:var(--shadow-s);margin-bottom:10px;min-height:36px;display:flex;align-items:center;justify-content:center;text-align:center}
.info-text{font-size:12px;font-weight:600;color:var(--slate-m);line-height:1.5}.info-text strong{font-weight:700;color:var(--plum)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:460px;width:100%}
.opts.s1{grid-template-columns:1fr}
.ob{background:var(--white);border:2px solid #F5D0FE;border-radius:var(--r);padding:13px 10px;font-size:clamp(12px,3vw,15px);font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--slate);cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);text-align:center;line-height:1.3;word-break:break-word}
.ob:hover{border-color:var(--plum-mid);transform:translateY(-2px);box-shadow:var(--shadow-s)}.ob:active{transform:scale(.96)}
.ob.ok{background:var(--green-lt);border-color:var(--green);color:#166534;animation:okP .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes okP{0%{transform:scale(.9)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
.ob.nope{animation:nSh .45s ease;opacity:.3;pointer-events:none}
@keyframes nSh{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.ob.off{opacity:.25;pointer-events:none}
.g-hint{margin-top:8px;font-size:12px;color:var(--plum);font-weight:600;min-height:18px;max-width:460px;text-align:center;line-height:1.5}
.streak-bx{position:fixed;top:64px;right:14px;background:linear-gradient(135deg,var(--amber),var(--gold));color:var(--slate);padding:6px 14px;border-radius:100px;font-weight:700;font-size:12px;box-shadow:var(--shadow-m);z-index:50;display:none}
.streak-bx.on{display:block;animation:sbI .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes sbI{0%{transform:translateX(80px) scale(.5);opacity:0}100%{transform:translateX(0) scale(1);opacity:1}}
.res-s{align-items:center;justify-content:center;background:linear-gradient(155deg,#FAE8FF 0%,#F5D0FE 50%,#E879F9 100%);padding:40px 24px;text-align:center;overflow:hidden}
.rs-st{display:flex;gap:12px;margin-bottom:20px}
.rs{width:48px;height:48px;opacity:0;transform:scale(0) rotate(-25deg)}.rs.got{animation:sE .6s cubic-bezier(.34,1.56,.64,1) forwards}
.rs:nth-child(2).got{animation-delay:.2s}.rs:nth-child(3).got{animation-delay:.4s}
@keyframes sE{0%{opacity:0;transform:scale(0) rotate(-25deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.rs svg{width:100%;height:100%}
.rs-t{font-size:26px;font-weight:700;margin-bottom:6px;animation:fU .6s ease .5s both}
.rs-msg{font-size:14px;color:var(--slate-m);font-weight:500;margin-bottom:10px;animation:fU .6s ease .6s both;line-height:1.6}
.rs-row{display:flex;gap:24px;margin:20px 0 30px;animation:fU .6s ease .7s both}
.rv{font-size:22px;font-weight:700;color:var(--plum-mid)}.rl{font-size:11px;color:var(--slate-m);font-weight:600}
@keyframes fU{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.btn-n{background:var(--plum-mid);color:#fff;border:none;padding:14px 40px;border-radius:100px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 8px 24px rgba(162,28,175,.3);transition:all .3s;animation:fU .6s ease .8s both}
.btn-n:hover{transform:translateY(-2px)}.btn-n:active{transform:scale(.97)}
.btn-s2{background:transparent;color:var(--slate-m);border:2px solid rgba(162,28,175,.2);padding:10px 26px;border-radius:100px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .3s;animation:fU .6s ease .9s both;margin-top:10px}
.btn-s2:hover{border-color:var(--plum-mid);color:var(--plum-mid)}
.ptc-b{position:fixed;inset:0;pointer-events:none;z-index:1000;overflow:hidden}
.ptc{position:absolute;border-radius:50%;animation:ptcF 1s ease-out forwards}
@keyframes ptcF{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}
.big-ok{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);width:84px;height:84px;z-index:999;pointer-events:none}
.big-ok.go{animation:bP .8s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes bP{0%{transform:translate(-50%,-50%) scale(0);opacity:0}40%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}
@media(max-width:480px){.opts{gap:6px}.ob{padding:11px 6px;font-size:clamp(11px,2.8vw,13px)}}
</style>
</head>
<body>
<div class="ptc-b" id="ptcB"></div>
<div class="big-ok" id="bigOk"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#16A34A"/><path d="M30 52L45 67L72 35" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

<div class="screen welcome active" id="scnW">
  <div class="w-box">
    <div class="w-badge">U → E · EDEXCEL PURE 1</div>
    <h1 class="w-title">积分<em>工坊</em></h1>
    <div class="w-skills">
      <div class="w-sk"><div class="w-sk-num" style="background:#A21CAF">1</div><span class="w-sk-expr">∫axⁿ dx = a/(n+1)·xⁿ⁺¹ + C</span></div>
      <div class="w-sk"><div class="w-sk-num" style="background:#0F766E">2</div><span class="w-sk-expr">½x² − 3x^(−½) 分数负幂</span></div>
      <div class="w-sk"><div class="w-sk-num" style="background:#C2410C">3</div><span class="w-sk-expr">(x+2)²/√x 先化简再积分</span></div>
      <div class="w-sk"><div class="w-sk-num" style="background:#1D4ED8">4</div><span class="w-sk-expr">给 f'(x) 和一点 → 求 y = f(x)</span></div>
    </div>
    <p class="w-sub">积分 xⁿ 及其和差与常数倍——先化简，再积分，别忘 + C<small>⚠ n = −1 除外（不在本范围）</small></p>
    <button class="btn-go" onclick="enterMap()">开始工作 →</button>
  </div>
</div>

<div class="screen map-s" id="scnM">
  <div class="m-top"><h2 class="m-h">工坊地图</h2><div class="m-st"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FBBF24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span id="allSt">0</span></div></div>
  <div class="m-list" id="mL"></div>
</div>

<div class="screen game-s" id="scnG">
  <div class="gh"><button class="gh-b" onclick="toMap()">← 返回</button><span class="gh-z" id="ghZ"></span><span class="gh-l" id="ghL"></span></div>
  <div class="gbd">
    <div class="gds" id="gDs"></div>
    <div class="q-card"><div class="q-lbl" id="qLbl">INTEGRATE</div><div class="q-expr" id="qExpr"></div><div class="q-cond" id="qCond"></div><div class="q-task" id="qTask"></div></div>
    <div class="rw-card" id="rwCard"><div class="rw-lbl" id="rwLbl">先化简 · Rewrite first</div><div id="rwLines"></div></div>
    <div class="step-panel" id="stP"><div class="step-title">解题步骤 · Working</div><div class="step-body" id="stB"></div></div>
    <div class="info-box"><div class="info-text" id="iTxt"></div></div>
    <div class="opts" id="optsG"></div>
    <div class="g-hint" id="gHint"></div>
  </div>
  <div class="streak-bx" id="strkB"></div>
</div>

<div class="screen res-s" id="scnR">
  <div class="rs-st" id="rsSt"></div>
  <h2 class="rs-t" id="rsT"></h2>
  <p class="rs-msg" id="rsMsg"></p>
  <div class="rs-row"><div><div class="rv" id="rvO">0</div><div class="rl">答对</div></div><div><div class="rv" id="rvS">0</div><div class="rl">最长连击</div></div></div>
  <button class="btn-n" id="btnN" onclick="goNxt()">继续工作</button>
  <button class="btn-s2" onclick="toMap()">返回地图</button>
</div>

<script>
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rnz(a,b){var v;do{v=ri(a,b)}while(v===0);return v}
function shuf(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=ri(0,i);var t=r[i];r[i]=r[j];r[j]=t}return r}
function show(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')});document.getElementById(id).classList.add('active')}
function burst(x,y,n){n=n||20;var box=document.getElementById('ptcB');var cs=['#A21CAF','#0F766E','#C2410C','#1D4ED8','#FBBF24','#16A34A'];for(var i=0;i<n;i++){var p=document.createElement('div');p.className='ptc';var sz=ri(5,11),ang=(Math.PI*2*i)/n+Math.random()*.5,d=ri(50,140);p.style.cssText='width:'+sz+'px;height:'+sz+'px;background:'+cs[i%cs.length]+';left:'+x+'px;top:'+y+'px;--tx:'+Math.cos(ang)*d+'px;--ty:'+(Math.sin(ang)*d-30)+'px';box.appendChild(p);setTimeout((function(el){return function(){el.remove()}})(p),1000)}}
function showCk(){var e=document.getElementById('bigOk');e.classList.remove('go');void e.offsetWidth;e.classList.add('go');setTimeout(function(){e.classList.remove('go')},900)}
function updStrk(){var b=document.getElementById('strkB');if(streak>=3){b.textContent='🔥 ×'+streak;b.classList.add('on');b.style.animation='none';void b.offsetWidth;b.style.animation=''}else b.classList.remove('on')}

/* ===== FRACTION-POWER TERM: (an/ad)x^(pn/pd) ===== */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%t;a=t}return a||1}
function sf(n,d){var g=gcd(Math.abs(n),Math.abs(d));n/=g;d/=g;if(d<0){n=-n;d=-d}return{n:n,d:d}}
function mk(an,ad,pn,pd){var c=sf(an,ad),p=sf(pn,pd);return{an:c.n,ad:c.d,pn:p.n,pd:p.d}}
function isZero(t){return t.an===0}
function diffT(t){if(t.pn===0)return mk(0,1,0,1);return mk(t.an*t.pn,t.ad*t.pd,t.pn-t.pd,t.pd)}
/* integrate (excluding power = -1, i.e. pn/pd == -1) */
function intT(t){
  var newPN=t.pn+t.pd,newPD=t.pd; /* power+1 */
  if(newPN===0)return mk(0,1,0,1); /* would be n=-1 case; excluded — return 0 placeholder */
  var newAN=t.an*t.pd,newAD=t.ad*newPN;
  return mk(newAN,newAD,newPN,newPD);
}
function powVal(t){return t.pn/t.pd}
function evalT(t,x){if(t.an===0)return 0;var coef=t.an/t.ad;var pw=t.pn/t.pd;return coef*Math.pow(x,pw)}

/* ===== DISPLAY ===== */
function powStr(pn,pd){
  var pow=pn/pd;
  if(pow===0)return'';if(pow===1)return'x';if(pow===2)return'x²';if(pow===3)return'x³';if(pow===4)return'x⁴';
  if(pow===0.5)return'√x';
  if(pow<0){var ap=-pow;var ds=ap===1?'x':ap===2?'x²':ap===3?'x³':ap===0.5?'√x':'x^'+ap;return'1/'+ds}
  return'x^('+pn+(pd!==1?'/'+pd:'')+')';
}
function fmtT(t,first){
  if(t.an===0)return'';
  var pow=t.pn/t.pd;var neg=t.an<0;var sign=neg?'−':'+';
  if(pow<0){
    var absN=Math.abs(t.an),D=t.ad;var g=gcd(absN,D);absN/=g;D/=g;
    var ap=-pow;var ds=ap===1?'x':ap===2?'x²':ap===3?'x³':ap===0.5?'√x':'x^('+(-t.pn)+(t.pd!==1?'/'+t.pd:'')+')';
    var numStr=D===1?String(absN):'('+absN+'/'+D+')';
    if(first)return(neg?'−':'')+numStr+'/'+ds;
    return' '+sign+' '+numStr+'/'+ds;
  }
  var ps=powStr(t.pn,t.pd);
  var absN=Math.abs(t.an),D=t.ad;var g=gcd(absN,D);absN/=g;D/=g;
  var cStr;
  if(D===1){cStr=(absN===1&&ps!=='')?'':String(absN)}
  else{cStr='('+absN+'/'+D+')'}
  if(first)return(neg?'−':'')+cStr+ps;
  return' '+sign+' '+cStr+ps;
}
function fmtPoly(terms){
  if(!terms||terms.length===0)return'0';
  var s='',first=true;
  terms.forEach(function(t){if(t.an===0)return;s+=fmtT(t,first);first=false});
  return s||'0';
}

/* ===== STEPS ===== */

/* ===== DISTRACTORS ===== */
function intDistractors(terms,suffix){
  suffix=suffix===undefined?' + C':suffix;
  var pool=[];
  /* forgot to divide by new power */
  var m1=terms.map(function(t){var np=t.pn+t.pd;return mk(t.an,t.ad,np,t.pd)});
  pool.push(fmtPoly(m1)+suffix);
  /* forgot to raise power */
  var m2=terms.map(function(t){var it=intT(t);return mk(it.an,it.ad,t.pn,t.pd)});
  pool.push(fmtPoly(m2)+suffix);
  /* signs flipped */
  var m3=terms.map(intT).map(function(t){return mk(-t.an,t.ad,t.pn,t.pd)});
  pool.push(fmtPoly(m3)+suffix);
  return pool;
}
function buildOpts(correct,distractors){
  var pool=new Set([correct]);
  distractors.forEach(function(d){if(d&&d!==correct)pool.add(d)});
  /* Top up to 4 if distractors collided: append a "+C" → specific-number variant or sign tweak */
  if(pool.size<4){
    var hasC=/\+ C$/.test(correct);
    var extras=hasC?[correct.replace(/\+ C$/,'+ '+ri(2,6)),correct.replace(/\+ C$/,'− '+ri(2,6)),correct.replace(/\+ C$/,'')]:
      [correct+' + '+ri(2,6),correct+' − '+ri(2,6),correct+'x'];
    for(var i=0;i<extras.length&&pool.size<4;i++)pool.add(extras[i]);
  }
  var arr=Array.from(pool).filter(function(s){return s!==correct});
  return shuf([correct].concat(shuf(arr).slice(0,3)));
}

/* ===== ZONE GENERATORS ===== */

/* Zone 1: Basic xⁿ sums/differences/multiples (positive integer powers) */
function genBasic(l){
  var nterms=l<3?ri(2,2):ri(2,3);
  var terms=[];var seen={};
  for(var i=0;i<nterms+1;i++){var n=ri(0,l<3?3:4);if(seen[n])continue;seen[n]=1;var a=rnz(-6,6);terms.push(mk(a,1,n,1))}
  if(terms.length<2)terms.push(mk(rnz(-4,4),1,1,1));
  var exprStr=fmtPoly(terms);
  var intTerms=terms.map(intT);
  var answer=fmtPoly(intTerms)+' + C';
  var opts=buildOpts(answer,intDistractors(terms));
  var steps=['∫ ('+exprStr+') dx','规则：∫axⁿ dx = a/(n+1)·xⁿ⁺¹'];
  terms.forEach(function(t){var it=intT(t);steps.push(fmtT(t,true).trim()+' → '+fmtT(it,true).trim())});
  steps.push('<span class="step-c">+ C</span>');steps.push(answer);
  return{expr:'∫ ('+exprStr+') dx',task:'求不定积分',answer:answer,options:opts,steps:steps,
    hint:'每项幂次 +1，再除以新幂次；常数倍保持，最后 + C',
    infoHint:'逐项积分 → <strong>'+fmtPoly(intTerms)+' + C</strong>'};
}

/* Zone 2: Fractional and negative powers (excluding -1) */
function genFracNeg(l){
  var sub=ri(0,2);var terms=[],exprStr,rwRows;
  if(sub===0){
    /* (1/2)x² − 3x^(−1/2)  — like the spec example */
    var a=rnz(1,4),b=rnz(2,5);
    terms=[mk(a,2,2,1),mk(-b,1,-1,2)];
    exprStr=fmtPoly(terms);
    rwRows=['x^(−1/2) = 1/√x','准备用幂次规则积分（幂次 +1）'];
  } else if(sub===1){
    /* a√x + b/x²  → a x^(1/2) + b x^(-2) */
    var a2=rnz(-4,4),b2=rnz(-4,4);
    terms=[mk(a2,1,1,2),mk(b2,1,-2,1)];
    exprStr=fmtPoly(terms);
    rwRows=['√x = x^(1/2)，1/x² = x^(−2)','两项都用幂次规则积分'];
  } else {
    /* a x^(3/2) + b x^(1/2) */
    var a3=rnz(-4,4),b3=rnz(-4,4);
    terms=[mk(a3,1,3,2),mk(b3,1,1,2)];
    exprStr=fmtPoly(terms);
    rwRows=['x^(3/2) 和 x^(1/2) 已是幂次形式','幂次 +1：3/2→5/2，1/2→3/2'];
  }
  var intTerms=terms.map(intT);
  var answer=fmtPoly(intTerms)+' + C';
  var opts=buildOpts(answer,intDistractors(terms));
  var steps=['∫ ('+exprStr+') dx','幂次 +1 后除以新幂次（除以分数 = 乘倒数）'];
  terms.forEach(function(t){var it=intT(t);steps.push(fmtT(t,true).trim()+' → '+fmtT(it,true).trim())});
  steps.push('<span class="step-c">+ C</span>');steps.push(answer);
  return{expr:'∫ ('+exprStr+') dx',task:'求不定积分（分数/负幂）',answer:answer,options:opts,steps:steps,
    hint:'分数幂积分：幂次 +1，再除以新幂次（注意除以分数）',
    infoHint:'逐项积分 → <strong>'+fmtPoly(intTerms)+' + C</strong>',
    rwLbl:'先化为 xⁿ · Rewrite',rwRows:rwRows};
}

/* Zone 3: Expand brackets first */
function genExpand(l){
  /* ∫(ax+b)(cx+d) dx OR ∫(x+a)² dx */
  var useSquare=Math.random()>.5;
  var exprStr,expanded;
  if(useSquare){
    var a=rnz(-4,4);
    /* (x+a)² = x² + 2a x + a² */
    expanded=[mk(1,1,2,1),mk(2*a,1,1,1),mk(a*a,1,0,1)];
    exprStr='(x '+(a>=0?'+ '+a:'− '+Math.abs(a))+')²';
    var rwRows=['(x '+(a>=0?'+ '+a:'− '+Math.abs(a))+')² = x² '+(2*a>=0?'+ '+(2*a):'− '+Math.abs(2*a))+'x + '+(a*a),'再逐项积分'];
  } else {
    var p=rnz(-3,3),q=ri(-4,4),r=rnz(-3,3),s=ri(-4,4);
    /* (px+q)(rx+s) = pr x² + (ps+qr) x + qs */
    var A=p*r,B=p*s+q*r,C=q*s;
    expanded=[];if(A!==0)expanded.push(mk(A,1,2,1));if(B!==0)expanded.push(mk(B,1,1,1));if(C!==0)expanded.push(mk(C,1,0,1));
    var e1=(p===1?'x':p===-1?'−x':p+'x')+(q>=0?' + '+q:' − '+Math.abs(q));
    var e2=(r===1?'x':r===-1?'−x':r+'x')+(s>=0?' + '+s:' − '+Math.abs(s));
    exprStr='('+e1+')('+e2+')';
    var rwRows=['展开：('+e1+')('+e2+')','= '+fmtPoly(expanded),'再逐项积分'];
  }
  var intTerms=expanded.map(intT);
  var answer=fmtPoly(intTerms)+' + C';
  var opts=buildOpts(answer,intDistractors(expanded));
  var steps=['∫ '+exprStr+' dx','先展开括号：'+fmtPoly(expanded),'再逐项积分：'];
  expanded.forEach(function(t){var it=intT(t);steps.push(fmtT(t,true).trim()+' → '+fmtT(it,true).trim())});
  steps.push('<span class="step-c">+ C</span>');steps.push(answer);
  return{expr:'∫ '+exprStr+' dx',task:'先展开括号，再积分',answer:answer,options:opts,steps:steps,
    hint:'积分前必须先展开括号——不能直接对括号积分',
    infoHint:'展开 = '+fmtPoly(expanded)+' → <strong>'+fmtPoly(intTerms)+' + C</strong>',
    rwLbl:'先展开 · Expand first',rwRows:rwRows};
}

/* Zone 4: Divide by sqrt(x) — (x²+...)/√x */
function genDivSqrt(l){
  /* (x² + ax + b)/√x = x^(3/2) + a x^(1/2) + b x^(-1/2) */
  var a=rnz(-4,4),b=rnz(-4,4);
  var terms=[mk(1,1,3,2),mk(a,1,1,2),mk(b,1,-1,2)];
  var numStr='x²'+(a>=0?' + '+(a===1?'':a)+'x':' − '+(Math.abs(a)===1?'':Math.abs(a))+'x')+(b>=0?' + '+b:' − '+Math.abs(b));
  var exprStr='('+numStr+')/√x';
  var intTerms=terms.map(intT);
  var answer=fmtPoly(intTerms)+' + C';
  var opts=buildOpts(answer,intDistractors(terms));
  var rwRows=['每项除以 √x = x^(1/2)：','x²/√x = x^(3/2)','x/√x = x^(1/2)','1/√x = x^(−1/2)','= '+fmtPoly(terms)];
  var steps=['∫ '+exprStr+' dx','分子每项除以 x^(1/2)：','= '+fmtPoly(terms),'再逐项积分（幂次 +1）：'];
  terms.forEach(function(t){var it=intT(t);steps.push(fmtT(t,true).trim()+' → '+fmtT(it,true).trim())});
  steps.push('<span class="step-c">+ C</span>');steps.push(answer);
  return{expr:'∫ '+exprStr+' dx',task:'先化简（除以√x），再积分',answer:answer,options:opts,steps:steps,
    hint:'先把分子每项除以 √x = x^(1/2)，化为 xⁿ 形式，再积分',
    infoHint:'化简 = '+fmtPoly(terms)+' → <strong>'+fmtPoly(intTerms)+' + C</strong>',
    rwLbl:'先除以 √x · Divide first',rwRows:rwRows};
}

/* Zone 5: Find equation of curve given f'(x) and a point — the headline skill */
function genFindCurve(l){
  /* f'(x) given, find y=f(x) using a point to find C */
  var nterms=ri(2,2);var terms=[];var seen={};
  for(var i=0;i<3;i++){var n=ri(0,l<3?2:3);if(seen[n])continue;seen[n]=1;terms.push(mk(rnz(-4,4),1,n,1))}
  if(terms.length<2)terms.push(mk(rnz(-3,3),1,1,1));
  var derivStr=fmtPoly(terms);
  /* integrate */
  var intTerms=terms.map(intT);
  /* pick a point (x0, y0) on the curve — choose integer x0, compute y0 = F(x0)+C with C chosen integer */
  var x0=ri(-2,3);
  var Cval=ri(-5,5);
  /* y0 = sum of evalT(intTerms,x0) + Cval */
  var fx0=0;intTerms.forEach(function(t){fx0+=evalT(t,x0)});
  var y0=Math.round(fx0+Cval);
  /* recompute Cval to be exact integer: Cval = y0 - fx0 */
  Cval=Math.round(y0-fx0);
  var fbase=fmtPoly(intTerms);
  function withC(c){return'y = '+fbase+(c>0?' + '+c:c<0?' − '+Math.abs(c):'')}
  var answer=withC(Cval);
  /* Build a pool of unique distractors, then top up to guarantee 4 options */
  var pool=[answer];
  function tryAdd(s){if(s&&pool.indexOf(s)<0)pool.push(s)}
  /* D1: forgot to use the point (C = 0) — the key conceptual error */
  tryAdd(withC(0));
  /* D2: wrong integration (forgot to divide by new power) but correct C */
  var wrongInt=fmtPoly(terms.map(function(t){var np=t.pn+t.pd;return mk(t.an,t.ad,np,t.pd)}));
  tryAdd('y = '+wrongInt+(Cval>0?' + '+Cval:Cval<0?' − '+Math.abs(Cval):''));
  /* D3..: wrong value of C (offset answer) — keep trying offsets until 4 unique */
  var offs=shuf([1,-1,2,-2,3,-3]);
  for(var oi=0;oi<offs.length&&pool.length<4;oi++){tryAdd(withC(Cval+offs[oi]))}
  var opts=shuf(pool.slice(0,4));
  if(opts.indexOf(answer)<0){opts[0]=answer;opts=shuf(opts)}
  var ptStr='('+x0+', '+y0+')';
  var steps=[
    "f'(x) = "+derivStr,
    '积分求 y：y = '+fbase+' + C',
    '代入点 '+ptStr+'：'+y0+' = '+fbase.replace(/x³/g,'('+x0+')³').replace(/x²/g,'('+x0+')²').replace(/x/g,'('+x0+')')+' + C',
    Math.round(fx0)+' + C = '+y0,
    '<span class="step-c">C = '+Cval+'</span>',
    answer
  ];
  return{expr:"f'(x) = "+derivStr,cond:'曲线过点 '+ptStr,task:'求曲线方程 y = f(x)',
    answer:answer,options:opts,steps:steps,
    hint:'先积分得 y = …+ C，再代入已知点解出 C（这就是为什么需要点）',
    infoHint:'积分后代入 '+ptStr+' → C = <strong>'+Cval+'</strong> → '+answer,
    rwLbl:'求 C 的关键步骤',rwRows:['积分：y = '+fbase+' + C','代入点 '+ptStr+' 解出 C = '+Cval]};
}

/* ===== ZONES ===== */
var ZONES=[
  {id:'bas',name:'基础积分 ∫xⁿ dx',desc:'和、差、常数倍 — 幂次 +1',
    color:'#A21CAF',bg:'#FAE8FF',icon:'∫xⁿ\n+C',levels:7,gen:genBasic},
  {id:'fn',name:'分数与负幂',desc:'½x²−3x^(−½) 类型（n≠−1）',
    color:'#0F766E',bg:'#CCFBF1',icon:'x^½\nx⁻²',levels:7,gen:genFracNeg},
  {id:'exp',name:'展开括号后积分',desc:'(x+2)² 先展开再积分',
    color:'#1D4ED8',bg:'#EFF6FF',icon:'(…)²\n→展开',levels:6,gen:genExpand},
  {id:'div',name:'除以根号类型',desc:'(x²+...)/√x 先化简再积分',
    color:'#C2410C',bg:'#FFF7ED',icon:'÷√x\n化简',levels:7,gen:genDivSqrt},
  {id:'crv',name:'求曲线方程',desc:'给 f\'(x) 和一点 → 求 y = f(x)',
    color:'#BE123C',bg:'#FFF1F3',icon:"f'(x)\n→y",levels:7,gen:genFindCurve},
  {id:'mix',name:'综合积分挑战',desc:'全类型混合',
    color:'#B45309',bg:'#FEF3C7',icon:'ALL',levels:8,gen:function(l){return ZONES[ri(0,4)].gen(l)}}
];

var QPL=5;
var CHEERS=['太棒了！xⁿ 积分及其变体你全掌握了！','完美！化简再积分的流程已内化！','了不起！从 f\'(x) 还原曲线方程一气呵成！','每一题都让你更强！','你已经理解了"代入点求 C"的精髓！','继续前进！','幂次 +1 除以新幂次 + C——这是你的本能！','分数幂、括号、根号——预处理难不倒你！'];
var OK_W=['正确!','太棒了!','完美!','漂亮!','没错!','好厉害!','Correct!','Well done!'];

var st=loadS();
function defS(){return{zones:ZONES.map(function(z){return{id:z.id,levels:Array(z.levels).fill(0)}}),total:0}}
function loadS(){try{var s=JSON.parse(localStorage.getItem('integrationWorkshop'));if(s&&s.zones)return s}catch(e){}return defS()}
function saveS(){st.total=st.zones.reduce(function(a,z){return a+z.levels.reduce(function(s,v){return s+v},0)},0);localStorage.setItem('integrationWorkshop',JSON.stringify(st))}
var cZ=0,cL=0,qs=[],qi=0,correct=0,streak=0,maxSk=0,attempts=0,answered=false;
function genQs(z,l){var q=[];for(var i=0;i<QPL;i++)q.push(z.gen(l));return q}

function renderMap(){
  var list=document.getElementById('mL');list.innerHTML='';
  document.getElementById('allSt').textContent=st.total;
  ZONES.forEach(function(z,zi){
    var zs=st.zones[zi],done=zs.levels.filter(function(v){return v>0}).length;
    var zStars=zs.levels.reduce(function(a,v){return a+v},0);
    var prevOk=zi===0||st.zones[zi-1].levels.filter(function(v){return v>0}).length>=Math.ceil(ZONES[zi-1].levels*.5);
    var unlocked=prevOk,complete=done===z.levels,current=unlocked&&!complete;
    var card=document.createElement('div');
    card.className='zc'+(unlocked?'':' lk')+(complete?' dn':'')+(current?' nw':'');
    card.innerHTML='<div class="zi" style="background:'+z.bg+';color:'+z.color+'">'+z.icon+'</div><div class="zb"><div class="zn" style="color:'+(unlocked?z.color:'#999')+'">'+z.name+'</div><div class="zd">'+(unlocked?z.desc:'完成前面的区域解锁')+'</div><div class="zdots">'+zs.levels.map(function(v,li){return'<div class="zdt'+(v>0?' on':'')+((! v&&(li===0||zs.levels[li-1]>0))?' cu':'')+'"></div>'}).join('')+'</div></div><div class="zr"><div class="zsv">'+zStars+'/'+z.levels*3+'</div></div>';
    if(unlocked)card.onclick=(function(i){return function(){openZ(i)}})(zi);
    list.appendChild(card);
  });
}
function openZ(zi){cZ=zi;var zs=st.zones[zi],l=zs.levels.findIndex(function(v){return v===0});if(l===-1)l=0;startLvl(l)}

function startLvl(l){
  cL=l;qi=0;correct=0;streak=0;maxSk=0;attempts=0;answered=false;
  var z=ZONES[cZ];qs=genQs(z,l);
  document.getElementById('ghZ').textContent=z.name;
  document.getElementById('ghZ').style.color=z.color;
  document.getElementById('ghL').textContent='Level '+(l+1);
  show('scnG');renderQ();
}

function renderQ(){
  answered=false;hideSteps();hideRewrite();
  var q=qs[qi];
  var dots=document.getElementById('gDs');dots.innerHTML='';
  for(var i=0;i<QPL;i++){var d=document.createElement('div');d.className='gd'+(i<qi?' done':'')+(i===qi?' act':'');dots.appendChild(d)}
  document.getElementById('qLbl').textContent=ZONES[cZ].name.toUpperCase();
  document.getElementById('qExpr').textContent=q.expr;
  document.getElementById('qCond').textContent=q.cond||'';
  document.getElementById('qCond').style.display=q.cond?'':'none';
  document.getElementById('qTask').textContent=q.task;
  document.getElementById('iTxt').innerHTML='分析表达式，选出正确答案…';
  document.getElementById('gHint').textContent='';
  var og=document.getElementById('optsG');og.innerHTML='';
  var longest=Math.max.apply(null,q.options.map(function(o){return o.length}));
  og.className=longest>24?'opts s1':'opts';
  q.options.forEach(function(opt){
    var btn=document.createElement('button');btn.className='ob';btn.textContent=opt;
    btn.onclick=function(){handleAns(opt,q,btn)};og.appendChild(btn);
  });
  updStrk();
}

function handleAns(chosen,q,btn){
  if(answered)return;attempts++;
  if(chosen===q.answer){
    answered=true;correct++;streak++;if(streak>maxSk)maxSk=streak;
    btn.classList.add('ok');
    document.querySelectorAll('.ob').forEach(function(b){if(!b.classList.contains('ok'))b.classList.add('off')});
    if(q.rwRows)showRewrite(q.rwLbl,q.rwRows);
    showSteps(q.steps);
    document.getElementById('iTxt').innerHTML=q.infoHint;
    var r=btn.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2,streak>=3?26:14);
    showCk();updStrk();
    document.getElementById('gHint').textContent=OK_W[ri(0,OK_W.length-1)];
    document.getElementById('gHint').style.color='#16A34A';
    setTimeout(function(){qi++;if(qi>=QPL)finishLvl();else renderQ()},Math.max(2600,q.steps.length*300+900));
  } else {
    streak=0;updStrk();btn.classList.add('nope');
    if(q.rwRows)showRewrite(q.rwLbl,q.rwRows);
    showSteps(q.steps);
    document.getElementById('iTxt').innerHTML=q.infoHint;
    document.getElementById('gHint').textContent='💡 '+q.hint;
    document.getElementById('gHint').style.color='#A21CAF';
  }
}

function finishLvl(){
  hideSteps();hideRewrite();
  var stars;if(attempts<=QPL)stars=3;else if(attempts<=QPL+2)stars=2;else stars=1;
  var prev=st.zones[cZ].levels[cL];if(stars>prev){st.zones[cZ].levels[cL]=stars;saveS()}
  var starsEl=document.getElementById('rsSt');starsEl.innerHTML='';
  for(var i=0;i<3;i++){var s=document.createElement('div');s.className='rs'+(i<stars?' got':'');s.innerHTML='<svg viewBox="0 0 24 24" fill="'+(i<stars?'#FBBF24':'#CBD5E1')+'"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';starsEl.appendChild(s)}
  document.getElementById('rsT').textContent=['做到了！','太棒了！','完美通关！'][Math.min(stars-1,2)];
  document.getElementById('rsMsg').textContent=CHEERS[ri(0,CHEERS.length-1)];
  document.getElementById('rvO').textContent=correct+'/'+QPL;
  document.getElementById('rvS').textContent=maxSk;
  var hasNext=cL+1<ZONES[cZ].levels;var btn=document.getElementById('btnN');
  btn.textContent=hasNext?'继续工作':'返回地图';btn.onclick=hasNext?goNxt:toMap;
  show('scnR');setTimeout(function(){burst(window.innerWidth/2,window.innerHeight/3,30)},500);
}
function goNxt(){if(cL+1<ZONES[cZ].levels)startLvl(cL+1);else toMap()}
function enterMap(){show('scnM');renderMap()}
function toMap(){hideSteps();hideRewrite();show('scnM');renderMap()}
saveS();
